# Engineering roster - the source of truth for which teams exist and who is on
# them. A quarterly reshuffle is a pull request against this file: add a team,
# move a person between teams, drop a member, delete a team. One apply
# reconciles all of it, removals included.
#
# Rules:
#   - name is the identity of a team. Renaming a team creates a new one and
#     destroys the old one, so rename deliberately.
#   - a person may appear on as many teams and in as many roles as needed.
#   - owners become the team's leaders in the catalog and its Owners group.
#   - a member who is not a Harness user yet is reported as pending and joins
#     automatically on the next run once their account exists.

quarter: 2027-Q1

